name: Probe App Store Connect credentials

# Temporary diagnostic workflow. It checks whether the repository's existing
# APPLE_API_* secrets can authenticate against App Store Connect for the iOS
# app, so the TestFlight workflow can reuse them instead of a new API key.
# Remove this file once the answer is known.

on:
  push:
    branches:
      - add-testflight-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REPO }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          ref: main
          path: zditor
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize the private key
        env:
          RAW_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$RAW_KEY" > "$RUNNER_TEMP/raw-key.p8"
          if grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/raw-key.p8"; then
            cp "$RUNNER_TEMP/raw-key.p8" "$RUNNER_TEMP/AuthKey.p8"
            echo "existing APPLE_API_KEY_P8 holds a PEM private key"
          else
            base64 -d "$RUNNER_TEMP/raw-key.p8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "existing APPLE_API_KEY_P8 holds base64 key material"
          fi
          head -1 "$RUNNER_TEMP/AuthKey.p8" | grep -q 'BEGIN PRIVATE KEY' && echo "private key decoded" || { echo "private key is neither PEM nor base64 PEM"; exit 1; }

      - name: Probe App Store Connect with the existing Apple API secrets
        working-directory: zditor
        env:
          RELEASE_VERSION: "9.9.9"
          BUILD_NUMBER: "9999"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.zditor.ai' }}
          IOS_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.IOS_USES_NON_EXEMPT_ENCRYPTION }}
          TESTFLIGHT_INTERNAL_GROUP_IDS: ${{ vars.TESTFLIGHT_INTERNAL_GROUP_IDS }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          echo "key id matches expected shape: $(printf '%s' "$APP_STORE_CONNECT_KEY_ID" | grep -cE '^[A-Z0-9]{10}$')"
          echo "issuer id matches expected shape: $(printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | grep -cE '^[a-fA-F0-9-]{36}$')"
          node scripts/testflight.mjs preflight
